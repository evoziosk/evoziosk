<svg xmlns="http://www.w3.org/2000/svg" width="640" height="20" viewBox="0 0 640 20">
<style>
.track { stroke: #d8dee4; } .motion { stroke: #8c959f; animation: drift 16s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(580px); } }
@media (prefers-color-scheme: dark) { .track { stroke: #30363d; } .motion { stroke: #6e7681; } }
@media (prefers-reduced-motion: reduce) { .motion { animation: none; } }
</style>
<path class="track" d="M0 10h640"/><path class="motion" d="M0 10h60" stroke-width="2"/>
</svg>
